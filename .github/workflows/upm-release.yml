name: Svelto.Tasks UPM Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPM_BRANCH: UPM-TASKS

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: verify release version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('Packages/com.sebaslab.svelto.tasks/package.json'))['version'])")
          CSPROJ_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Packages/com.sebaslab.svelto.tasks/Svelto.Tasks/Svelto.Tasks.csproj').read()).group(1))")
          test "$VERSION" = "$CSPROJ_VERSION" || { echo "package.json version ($VERSION) != Svelto.Tasks.csproj PackageVersion ($CSPROJ_VERSION)"; exit 1; }

      - name: assemble clean UPM package
        run: |
          PACKAGE_DIR="$RUNNER_TEMP/svelto-tasks-upm"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          rsync -r --exclude '.git' --exclude '.github' --exclude '.aiguides' \
            --exclude 'PROPOSALS' --exclude 'Svelto.Tasks.Tests~' --exclude 'AGENTS.md' \
            --exclude '*.csproj' --exclude '*.nuspec' --exclude '*.targets' \
            --exclude 'bin' --exclude 'obj' --exclude 'bin~' --exclude 'obj~' \
            Packages/com.sebaslab.svelto.tasks/ "$PACKAGE_DIR/"
          test -f "$PACKAGE_DIR/package.json"

      # Source repositories ignore Unity .meta files; the UPM branch commits stable UUIDv3 metadata.
      - name: generate deterministic Unity metadata
        uses: ./.github/actions/generate-unity-meta
        with:
          package-directory: ${{ runner.temp }}/svelto-tasks-upm

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('Packages/com.sebaslab.svelto.tasks/package.json'))['version'])")
          PACKAGE_DIR="$RUNNER_TEMP/svelto-tasks-upm"
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git checkout -B "$UPM_BRANCH" "origin/$UPM_BRANCH" 2>/dev/null || git checkout --orphan "$UPM_BRANCH"
          git rm -rf --ignore-unmatch .
          git clean -ffdx
          rsync -r "$PACKAGE_DIR/" .
          git config user.email "noreply@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "UPM package version ${VERSION}"
          git tag "$VERSION"
          git push origin "$UPM_BRANCH" --force
          git push origin "$VERSION"
          gh release create "$VERSION" --title "Svelto.Tasks ${VERSION}" --generate-notes --verify-tag
