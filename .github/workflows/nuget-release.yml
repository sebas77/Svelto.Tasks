name: Svelto.Tasks NuGet Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: verify release version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('Packages/com.sebaslab.svelto.tasks/package.json'))['version'])")
          CSPROJ_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Packages/com.sebaslab.svelto.tasks/Svelto.Tasks/Svelto.Tasks.csproj').read()).group(1))")
          test "$VERSION" = "$CSPROJ_VERSION" || { echo "package.json version ($VERSION) != Svelto.Tasks.csproj PackageVersion ($CSPROJ_VERSION)"; exit 1; }

      - name: verify Svelto.Common is published
        run: |
          COMMON_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Packages/com.sebaslab.svelto.common/Svelto.Common/Svelto.Common.csproj').read()).group(1))")
          curl --retry 8 --retry-delay 15 --retry-all-errors -fsS -o /dev/null "https://api.nuget.org/v3-flatcontainer/svelto.common/${COMMON_VERSION}/svelto.common.nuspec"

      - name: pack
        run: dotnet pack Packages/com.sebaslab.svelto.tasks/Svelto.Tasks/Svelto.Tasks.csproj -c Release -o temp

      - name: push
        run: dotnet nuget push "temp/Svelto.Tasks.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
