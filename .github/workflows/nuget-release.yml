name: Svelto NuGet Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Which packages to publish'
        type: choice
        options: [both, tasks, common]
        default: both

jobs:
  common:
    if: ${{ github.event.inputs.packages != 'tasks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify csproj matches package.json version
        run: |
          CSproj=$(python3 -c "import json;print(json.load(open('Packages/com.sebaslab.svelto.common/package.json'))['version'])")
          # package.json is the UPM version source; csproj must match (it feeds nuget.org)
          CSPROJ_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Packages/com.sebaslab.svelto.common/Svelto.Common/Svelto.Common.csproj').read()).group(1))")
          test "$CSproj" = "$CSPROJ_VERSION" || { echo "package.json version ($CSproj) != Svelto.Common.csproj PackageVersion ($CSPROJ_VERSION)"; exit 1; }
      - name: pack
        run: dotnet pack Packages/com.sebaslab.svelto.common/Svelto.Common/Svelto.Common.csproj -c Release -o temp
      - name: push
        run: dotnet nuget push "temp/Svelto.Common.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  tasks:
    needs: common
    # always() + explicit input check: needs: alone would skip this job whenever
    # the common job is skipped (packages == tasks)
    if: ${{ always() && github.event.inputs.packages != 'common' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify csproj matches package.json version
        run: |
          CSproj=$(python3 -c "import json;print(json.load(open('Packages/com.sebaslab.svelto.tasks/package.json'))['version'])")
          # package.json is the UPM version source; csproj must match (it feeds nuget.org)
          CSPROJ_VERSION=$(python3 -c "import re;print(re.search(r'<PackageVersion>([^<]+)</PackageVersion>', open('Packages/com.sebaslab.svelto.tasks/Svelto.Tasks/Svelto.Tasks.csproj').read()).group(1))")
          test "$CSproj" = "$CSPROJ_VERSION" || { echo "package.json version ($CSproj) != Svelto.Tasks.csproj PackageVersion ($CSPROJ_VERSION)"; exit 1; }
      - name: pack
        run: dotnet pack Packages/com.sebaslab.svelto.tasks/Svelto.Tasks/Svelto.Tasks.csproj -c Release -o temp
      - name: push
        run: dotnet nuget push "temp/Svelto.Tasks.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
